a{color:inherit;text-decoration:none;cursor:pointer}
button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}
.muted{color:var(--muted)}.small{font-size:12px}
.green-t{color:var(--green)}.red-t{color:var(--red)}
.up{color:var(--green)}.down{color:var(--red)}

main{max-width:620px;margin:0 auto;padding:0 18px calc(96px + var(--safe-b))}
@media (min-width:900px){main{max-width:1180px;padding:0 32px calc(110px + var(--safe-b))}
  .home-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:36px;align-items:start}
  .col-side{padding-top:24px}
  #v-auditor,#v-token,#v-agents,#v-activity,#v-account{max-width:640px;margin:0 auto}
}
.view{display:none;animation:fade .25s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.top{display:flex;align-items:center;justify-content:space-between;height:56px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:17px}
.chev{color:var(--muted)}
.logo{width:26px;height:26px;border-radius:50%;border:3px solid #fff;position:relative;flex:none}
.logo:after{content:"";position:absolute;inset:5px;border-radius:50%;background:#fff}
.logo.sm{width:24px;height:24px}.logo.big{width:56px;height:56px;border-width:5px;margin:0 auto}.logo.big:after{inset:12px}
.badge{font-size:10px;font-weight:700;letter-spacing:.06em;padding:3px 7px;border-radius:6px;background:var(--card2);color:var(--muted);margin-left:4px}
.badge.live{background:var(--red-d);color:var(--red)}.badge.sim{background:#2a2410;color:#f5c542}
.run-dot{width:10px;height:10px;border-radius:50%;background:var(--muted);display:inline-block}
.run-dot.on{background:var(--green);box-shadow:0 0 10px var(--green);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.4}}
.back{color:var(--green);font-size:17px;font-weight:500}

.balance{font-size:58px;font-weight:700;letter-spacing:-2px;font-variant-numeric:tabular-nums;margin-top:6px;line-height:1.05}
@media (min-width:900px){.balance{font-size:76px}}
.delta-row{display:flex;align-items:center;gap:8px;margin-top:6px;font-weight:600;font-size:16px}
.pill{background:var(--green);color:#000;font-weight:700;border-radius:999px;padding:2px 9px;font-size:14px}
.pill.red{background:var(--red);color:#fff}
.halted{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--red-d);color:var(--red);font-size:13px}

.chart-wrap{position:relative;height:230px;margin:18px -18px 0}
.chart-wrap.tall{height:300px;margin:14px 0 0}
.chart-wrap svg{width:100%;height:100%;display:block}
#eqMarkers{position:absolute;inset:0;pointer-events:none}
.mk{position:absolute;transform:translate(-50%,-130%);white-space:nowrap;font-size:11px;font-weight:700;padding:3px 8px 3px 4px;border-radius:999px;display:flex;align-items:center;gap:4px;border:1px solid}
.mk img,.mk .av{width:14px;height:14px;border-radius:50%;font-size:7px}
.mk.buy{background:#0d1a2b;border-color:#1f4f85;color:#cfe5ff}
.mk.win{background:var(--green-d);border-color:#1f7a47;color:var(--green)}
.mk.loss{background:var(--red-d);border-color:#7a1f2a;color:#ff8a95}

.tf{display:flex;justify-content:space-between;margin:10px 0 6px}
.tf button{background:none;border:0;color:var(--green);font-weight:600;font-size:14px;padding:6px 12px;border-radius:999px;display:flex;align-items:center;gap:5px}
.tf button i{width:6px;height:6px;border-radius:50%;background:currentColor;display:none}
.tf button.on{background:var(--green);color:#000}.tf button.on i{display:block}

.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 12px}
.sec-head h2{margin:0;font-size:24px;letter-spacing:-.4px}
.sec-head a,.sec-head span{font-size:15px}

.agents-scroll{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -18px;padding:0 18px 4px;scrollbar-width:none}
.agents-scroll::-webkit-scrollbar{display:none}
.agent{flex:none;width:156px;height:150px;background:var(--card);border-radius:16px;padding:12px;scroll-snap-align:start;cursor:pointer;position:relative;overflow:hidden}
.agent h4{margin:0;font-size:15px;display:flex;align-items:center;gap:6px}
.agent .sub{font-size:11px;color:var(--muted);margin:2px 0 8px;display:flex;align-items:center;gap:4px}
.agent .sub:before{content:"";width:5px;height:5px;border-radius:50%;background:var(--green)}
.ic{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:12px}
.mini-row{display:flex;align-items:center;justify-content:space-between;font-size:10px;margin:4px 0;color:var(--muted)}
.mini-row s{color:#a33;text-decoration-color:#ff4757}
.mini-row em{font-style:normal;color:#ff6b78;font-size:9px}
.bars{display:flex;gap:3px;margin:6px 0}.bars i{flex:1;height:7px;border-radius:2px;background:#333}.bars i.ok{background:var(--green)}.bars i.ko{background:var(--red)}
.gauge{width:62px;height:62px;margin:6px 0}
.gauge-wrap{display:flex;align-items:center;gap:8px}
.exec-btn{margin-top:8px;background:var(--green-d);color:var(--green);border-radius:10px;padding:6px;text-align:center;font-size:12px;font-weight:600}
.tag{display:inline-block;font-size:9px;padding:2px 6px;border-radius:5px;background:var(--red-d);color:#ff8a95;margin-right:3px}
.dots{display:flex;justify-content:center;gap:5px;margin-top:10px}.dots i{width:5px;height:5px;border-radius:50%;background:#444}.dots i.on{background:#ddd}

.list .row{display:flex;align-items:center;gap:12px;padding:10px 0;cursor:pointer}
.av{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;position:relative;background-size:cover;background-position:center}
.av .b{position:absolute;right:-2px;bottom:-2px;width:15px;height:15px;border-radius:50%;border:2px solid #000;font-size:8px;display:grid;place-items:center}
.row .mid{flex:1;min-width:0}.row .mid b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .mid span{font-size:13px;color:var(--muted)}.row .mid span.r{color:#ff6b78}
.row .rt{text-align:right;font-variant-numeric:tabular-nums}.row .rt b{display:block;font-size:16px}.row .rt span{font-size:12px;color:var(--muted)}

.pos-card{background:var(--card);border-radius:16px;padding:14px;display:flex;align-items:center;gap:12px;margin-bottom:10px;cursor:pointer}
.pos-card .mid{flex:1}.pos-card b{font-size:16px}.pos-card span{font-size:12px;color:var(--muted);display:block}
.pos-card .rt{text-align:right}

.title{font-size:34px;margin:4px 0 16px;letter-spacing:-.6px}.title.sm{font-size:28px;margin:0}
.counters{display:grid;grid-template-columns:repeat(3,1fr);margin-bottom:22px}
.counters label{display:block;font-size:12px;color:var(--muted)}.counters b{font-size:28px}
.tok-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.tok-head .nm{flex:1}.tok-head b{font-size:20px}.tok-head b small{font-weight:400;color:var(--muted);font-size:13px;margin-left:4px}
.tok-head span{display:block;font-size:12px;color:var(--muted);font-family:ui-monospace,Menlo,monospace}
.chip{font-size:12px;padding:4px 10px;border-radius:8px;background:var(--card2);color:var(--blue);font-weight:600}
.chip.red{background:var(--red-d);color:var(--red)}.chip.green{background:var(--green-d);color:var(--green)}

.stack-wrap{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:start;position:relative}
.stack{position:relative;height:330px}
.disc{position:absolute;left:8px;width:130px;height:38px;border-radius:50%;border:1.5px solid #3a3a40;background:radial-gradient(ellipse at 50% 40%,#1d1d22,#0b0b0d);transition:all .35s ease;display:grid;place-items:center;overflow:hidden}
.disc:after{content:"";position:absolute;inset:7px 26px;border-radius:50%;border:1px solid #333}
.disc.ok{border-color:var(--green);box-shadow:0 0 12px #22e07a33}
.disc.ok:after{border-color:#22e07a66}
.disc.fail{border-color:var(--red);background:radial-gradient(ellipse at 50% 40%,#c0303e,#5a0f17);box-shadow:0 0 16px #ff475766}
.disc.reading{border-color:var(--blue);box-shadow:0 0 18px #4aa3ff66;transform:translateX(10px)}
.disc.skipped{opacity:.35}
.disc.top{background-size:cover;background-position:center}
.disc.top:after{display:none}
.checks .ck{height:41.5px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;border-radius:8px}
.ck label{display:block;font-size:10px;color:var(--muted)}.ck b{font-size:13px;font-weight:600}
.ck.reading{background:#11161d}.ck.fail{background:var(--red-d)}.ck.fail b{color:var(--red)}.ck.skipped b{color:#555}
.ckI{width:18px;height:18px;border-radius:50%;border:1.5px solid #444;display:grid;place-items:center;font-size:11px;font-weight:900;color:#000;flex:none}
.ck.ok .ckI{background:var(--green);border-color:var(--green)}.ck.fail .ckI{background:var(--red);border-color:var(--red);color:#fff}
.ck.reading .ckI{border-color:var(--blue);border-top-color:transparent;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.status-card{margin-top:18px;background:var(--card);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px}
.status-card .si{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:900;flex:none;background:#1e2633;color:var(--blue)}
.status-card b{display:block;font-size:17px}.status-card span{font-size:13px;color:var(--muted)}
.status-card.rej{background:var(--red-d)}.status-card.rej .si{background:var(--red);color:#fff}.status-card.rej b{color:var(--red)}
.status-card.clr{background:var(--green-d)}.status-card.clr .si{background:var(--green);color:#000}.status-card.clr b{color:var(--green)}
.progress{height:4px;border-radius:2px;background:#2b2b30;margin-top:8px;overflow:hidden}.progress i{display:block;height:100%;background:var(--blue);transition:width .3s}
.toggle-card{margin-top:12px;background:var(--card);border-radius:16px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.toggle-card b{display:block;font-size:16px}.toggle-card span{font-size:12px;color:var(--muted)}
.switch{position:relative;width:52px;height:32px;flex:none}.switch input{display:none}
.switch i{position:absolute;inset:0;border-radius:999px;background:#39393d;transition:.2s}
.switch i:after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked+i{background:var(--green)}.switch input:checked+i:after{left:23px}

.price{font-size:46px;font-weight:700;letter-spacing:-1.5px;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px;margin:16px 0}
.grid2 label{display:block;font-size:12px;color:var(--muted)}.grid2 b{font-size:18px}
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
.stat{background:var(--card);border-radius:14px;padding:12px}.stat label{font-size:12px;color:var(--muted)}.stat b{display:block;font-size:22px;margin-top:2px}
.card{background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.card.flex{display:flex;align-items:center;gap:12px}
.card.win{background:var(--green-d)}
.card h3{margin:0 0 10px;font-size:17px;display:flex;align-items:center;gap:8px}
.field{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);gap:10px}
.field:first-of-type{border-top:0}
.field span{font-size:14px}.field small{display:block;color:var(--muted);font-size:11px}
.field input[type=number]{width:96px;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:7px 9px;font-size:15px;text-align:right}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;font-size:15px;background:var(--card2)}
.btn.green{background:var(--green);color:#000}.btn.red{background:var(--red);color:#fff}.btn.full{width:100%;margin-top:8px}
.seg{display:flex;background:var(--card);border-radius:10px;padding:3px;margin:6px 0 8px}
.seg button{flex:1;border:0;background:none;padding:7px;border-radius:8px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--card2);color:var(--text)}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all}
.warn{background:#2a2410;color:#f5c542;border-radius:12px;padding:12px;font-size:13px;line-height:1.45;margin-bottom:10px}

.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:rgba(10,10,12,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid #1a1a1d;padding:8px 0 calc(8px + var(--safe-b));z-index:20}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);min-width:70px}
.tabbar svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.tabbar a.on{color:#fff}.tabbar a.on svg{fill:#fff;stroke:#fff}

#toasts{position:fixed;top:calc(8px + var(--safe-t));left:0;right:0;z-index:50;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{width:min(560px,calc(100% - 20px));background:rgba(235,235,240,.94);color:#111;backdrop-filter:blur(20px);border-radius:20px;padding:11px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 30px #0008;animation:drop .35s cubic-bezier(.2,1.2,.4,1)}
.toast .logo{border-color:#111}.toast .logo:after{background:#111}
.toast .mid{flex:1}.toast b{font-size:15px}.toast span{display:block;font-size:14px}.toast small{color:#777;font-size:12px}
.toast.out{animation:up .3s forwards}
@keyframes drop{from{transform:translateY(-120%)}to{transform:none}}
@keyframes up{to{transform:translateY(-130%);opacity:0}}

#login{position:fixed;inset:0;background:#000;z-index:100;display:grid;place-items:center}
.login-box{width:280px;text-align:center}.login-box h2{margin:14px 0 20px}
.login-box input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:#fff;font-size:16px;margin-bottom:10px}
.login-box .btn{width:100%}

.confetti{position:fixed;top:-10px;width:8px;height:12px;z-index:40;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}

/* ================= ANIMATIONS v2 ================= */
/* Compteur à rouleaux */
.balance{line-height:1;display:flex;height:1.05em;overflow:hidden}
.odo-c{display:inline-block;height:1em;line-height:1}
.odo-d{overflow:hidden;width:.6em;text-align:center}
.odo-s{display:flex;flex-direction:column;transition:transform .55s cubic-bezier(.2,.9,.25,1)}
.odo-s i{font-style:normal;height:1em;line-height:1}
.balance.flash-up{animation:flashUp 1.2s ease}.balance.flash-down{animation:flashDown 1.2s ease}
@keyframes flashUp{0%{color:var(--green);text-shadow:0 0 24px #22e07a88}100%{color:#fff;text-shadow:none}}
@keyframes flashDown{0%{color:var(--red);text-shadow:0 0 24px #ff475788}100%{color:#fff;text-shadow:none}}

/* Graphe */
.area-in{animation:areaIn 1.2s ease}
@keyframes areaIn{from{opacity:0}to{opacity:1}}
.mk.pop{animation:mkPop .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes mkPop{0%{transform:translate(-50%,-130%) scale(.2);opacity:0}100%{transform:translate(-50%,-130%) scale(1);opacity:1}}

/* Écrans poussés (Auditor, token) */
.view.push{animation:push .35s cubic-bezier(.2,.8,.2,1)}
@keyframes push{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}

/* ---- Pile 3D de l'Auditor ---- */
.stack{position:relative;height:340px;perspective:700px}
.stack .disc{position:absolute;left:6px;width:132px;height:40px;border-radius:50%;
  top:calc(120px + var(--i) * 7px);z-index:calc(20 - var(--i));
  border:1.5px solid #3a3a40;background:radial-gradient(ellipse at 50% 35%,#202026,#09090b 70%);
  box-shadow:0 5px 0 -1px #121215,0 5px 0 0 #2c2c31,0 10px 18px #000a;
  transition:top .32s cubic-bezier(.2,.9,.2,1) calc(var(--i) * 18ms),transform .15s ease,border-color .3s,background .3s,box-shadow .3s,opacity .3s;
  display:block;overflow:visible}
.stack .disc:after{display:none}
.stack.open .disc{top:calc(var(--i) * 41.5px)}
.disc-face{position:absolute;inset:0;border-radius:50%;overflow:hidden;display:grid;place-items:center}
.disc-face svg{width:100%;height:100%;fill:none;stroke:#4a4a52;stroke-width:1.4;stroke-linecap:round;transition:stroke .3s}
.disc-face svg .fill,.disc-face svg .fill *{fill:#4a4a52;stroke:none;transition:fill .3s}
.disc-img{position:absolute;inset:3px;border-radius:50%;background-size:cover;background-position:center;display:grid;place-items:center;font-weight:900;font-size:13px;color:#fff;transform:scaleY(1)}
.disc .wire{position:absolute;left:100%;top:50%;width:18px;height:1.5px;background:#333;opacity:0;transition:opacity .2s .2s,background .15s}
.stack.open .disc .wire{opacity:1}
.disc.ok{border-color:var(--green);box-shadow:0 5px 0 -1px #0a1f13,0 5px 0 0 #1b6e40,0 0 16px #22e07a33}
.disc.ok svg{stroke:var(--green)}.disc.ok svg .fill,.disc.ok svg .fill *{fill:var(--green)}.disc.ok .wire{background:var(--green)}
.disc.fail{border-color:#ff6b78;background:radial-gradient(ellipse at 50% 35%,#e0424f,#6a0f19 75%);box-shadow:0 5px 0 -1px #3a070d,0 5px 0 0 #a3202d,0 0 26px #ff475799;animation:shake .45s}
.disc.fail svg{stroke:#ffd0d4}.disc.fail .wire{background:var(--red)}
.disc.reading{border-color:var(--blue);transform:translateX(14px) scale(1.04);box-shadow:0 5px 0 -1px #0a1626,0 5px 0 0 #1f4f85,0 0 26px #4aa3ff88}
.disc.reading svg{stroke:var(--blue);animation:scan 1s linear infinite}
.disc.reading .wire{background:var(--blue)}
.disc.skipped{opacity:.28}
.stack.done-ok .disc{animation:okWave .4s ease calc(var(--i) * 30ms)}
@keyframes okWave{50%{transform:translateX(6px);box-shadow:0 0 28px #22e07aaa}}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes scan{50%{opacity:.4}}
.checks .ck{opacity:0;transform:translateX(-10px);transition:opacity .2s calc(.12s + var(--i) * 18ms),transform .2s calc(.12s + var(--i) * 18ms),background .15s}
.checks.open .ck{opacity:1;transform:none}
.ck.land .ckI{animation:land .45s cubic-bezier(.2,1.8,.4,1)}
@keyframes land{0%{transform:scale(0)}100%{transform:scale(1)}}
.ck.fail.land{animation:failRow .6s}
@keyframes failRow{0%{background:#ff475755}100%{background:var(--red-d)}}
.bump{animation:bump .4s cubic-bezier(.2,1.8,.4,1);display:inline-block}
@keyframes bump{0%{transform:scale(1.35)}100%{transform:scale(1)}}
.pop-in{animation:popIn .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes popIn{0%{transform:scale(.92);opacity:.3}100%{transform:none;opacity:1}}
.chip.pulse{animation:pulse 1s infinite}
.spin-s{animation:spinS 2.4s linear infinite}
@keyframes spinS{to{transform:rotate(360deg)}}

/* Mini pile dans la carte Auditor */
.mini-wrap{display:flex;gap:8px;align-items:flex-start;margin-top:4px}
.mini-stack{position:relative;width:46px;height:62px;flex:none}
.mini-stack i{position:absolute;left:0;width:46px;height:13px;border-radius:50%;top:calc(var(--i) * 6.5px);border:1px solid #3a3a40;background:#141417;transition:.3s}
.mini-stack i.ok{border-color:var(--green);background:#0f3d24}
.mini-stack i.fail{border-color:var(--red);background:#7a1520}
.mini-stack i.reading{border-color:var(--blue);background:#10223a;transform:translateX(4px)}
.mini-wrap .bars{margin-top:2px}
.mini-wrap .bars i{height:6px}

/* Activité */
.row.slide-in{animation:slideIn .5s cubic-bezier(.2,.9,.2,1)}
@keyframes slideIn{from{opacity:0;transform:translateY(-14px);background:#22e07a14}to{opacity:1;transform:none;background:transparent}}
.agent{transition:transform .2s}.agent:active{transform:scale(.97)}

.pos-card.watch{border:1px solid #3a3210;background:#16140c}.pos-card.watch .progress{margin-top:6px;height:3px}
.grid4{grid-template-columns:repeat(2,1fr)}

.halted.info{background:#1d1a0c;color:#f5c542}

.idle-card{margin-top:12px;background:#15140d;border:1px solid #3a3210;border-radius:16px;padding:14px 16px;display:flex;gap:14px;align-items:center}
.idle-card b{display:block;font-size:16px;color:#f5c542}.idle-card span{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.idle-card.bad{background:var(--red-d);border-color:#7a1f2a}.idle-card.bad b{color:var(--red)}
.radar{width:34px;height:34px;border-radius:50%;flex:none;position:relative;border:2px solid #f5c54255;background:conic-gradient(from 0deg,#f5c54200 0deg,#f5c54288 60deg,#f5c54200 61deg);animation:spin 2s linear infinite}
.radar.bad{border-color:#ff475755;background:none;animation:pulse 1s infinite}

.disc.wait{border-color:#f5c542;background:radial-gradient(ellipse at 50% 35%,#5a4a12,#1d1806 75%);box-shadow:0 5px 0 -1px #2a2208,0 5px 0 0 #8a6f14,0 0 22px #f5c54266}
.disc.wait svg{stroke:#f5c542}.disc.wait .wire{background:#f5c542}
.ck.wait{background:#1d1a0c}.ck.wait b{color:#f5c542}.ck.wait .ckI{background:#f5c542;border-color:#f5c542;color:#000;font-size:10px}
.mini-stack i.wait{border-color:#f5c542;background:#3a3210}.bars i.wt{background:#f5c542}
.status-card.wait{background:#1d1a0c}.status-card.wait .si{background:#f5c542;color:#000}.status-card.wait b{color:#f5c542}
.chip.amber{background:#2a2410;color:#f5c542}
</style>
</head>
<body>
<div id="toasts"></div>

<div id="login" class="hidden">
  <div class="login-box">
    <div class="logo big"></div>
    <h2>Neo Bot</h2>
    <input id="pw" type="password" placeholder="Mot de passe" autocomplete="current-password">
    <button class="btn green" id="loginBtn">Entrer</button>
    <div id="loginErr" class="muted small"></div>
  </div>
</div>

<main id="app">
  <!-- ================= HOME ================= -->
  <section id="v-home" class="view active">
    <header class="top">
      <div class="brand"><div class="logo"></div><span id="botName">Neo Bot</span><span class="chev">›</span><span id="modeBadge" class="badge">PAPER</span></div>
      <div class="top-icons"><span id="runDot" class="run-dot"></span></div>
    </header>
    <div class="home-grid">
      <div class="col-main">
        <div class="balance"><span id="balance">$0.00</span></div>
        <div class="delta-row"><span id="delta" class="up">▲ $0.00 (0.00%)</span><span id="mult" class="pill">1.00x</span></div>
        <div id="halted" class="halted hidden"></div>
        <div class="chart-wrap"><svg id="eqChart" preserveAspectRatio="none"></svg><div id="eqMarkers"></div></div>
        <div class="tf" id="tf">
          <button data-r="live" class="on"><i></i>LIVE</button><button data-r="1h">1H</button><button data-r="4h">4H</button>
          <button data-r="1d">1D</button><button data-r="1w">1W</button><button data-r="all">ALL</button>
        </div>
        <div class="sec-head"><h2>Agents</h2><span class="green-t" id="agentsRunning">5 running</span></div>
        <div class="agents-scroll" id="agentCards"></div>
        <div class="dots"><i class="on"></i><i></i><i></i><i></i><i></i></div>
      </div>
      <div class="col-side">
        <div id="openPositions"></div>
        <div class="sec-head"><h2>Activity</h2><a class="green-t" data-go="activity">See all</a></div>
        <div id="activityShort" class="list"></div>
      </div>
    </div>
  </section>

  <!-- ================= AUDITOR ================= -->
  <section id="v-auditor" class="view">
    <header class="top"><a class="back" data-back>‹ Home</a><span class="logo sm"></span></header>
    <h1 class="title">Auditor</h1>
    <div class="counters">
      <div><label>Taken apart</label><b id="aTaken">0</b></div>
      <div><label>Rejected</label><b id="aRej" class="red-t">0</b></div>
      <div><label>Cleared</label><b id="aClr" class="green-t">0</b></div>
    </div>
    <div class="tok-head" id="aTok"></div>
    <div class="stack-wrap"><div class="stack" id="aStack"></div><div class="checks" id="aChecks"></div></div>
    <div id="aStatus" class="status-card"></div>
    <div id="aIdle" class="idle-card hidden"></div>
    <div class="toggle-card">
      <div><b>Take apart before buying</b><span>Never buy a coin it can't take apart first</span></div>
      <label class="switch"><input type="checkbox" id="auditToggle" checked><i></i></label>
    </div>
  </section>

  <!-- ================= TOKEN ================= -->
  <section id="v-token" class="view">
    <header class="top"><a class="back" data-back>‹ Back</a></header>
    <div class="tok-head" id="tHead"></div>
    <div class="price" id="tPrice">$0</div>
    <div id="tSince" class="up">▲ 0% since entry</div>
    <div class="chart-wrap tall"><svg id="tChart" preserveAspectRatio="none"></svg></div>
    <div class="grid2" id="tStats"></div>
    <div id="tPos"></div>
  </section>

  <!-- ================= AGENTS ================= -->
  <section id="v-agents" class="view">
    <header class="top"><h1 class="title sm">Agents</h1></header>
    <div id="agentSettings"></div>
  </section>

  <!-- ================= ACTIVITY ================= -->
  <section id="v-activity" class="view">
    <header class="top"><h1 class="title sm">Activity</h1></header>
    <div class="grid4" id="statsGrid"></div>
    <div class="seg" id="actFilter"><button data-f="all" class="on">Tout</button><button data-f="trades">Trades</button><button data-f="rejected">Rejets</button></div>
    <div id="activityFull" class="list"></div>
  </section>

  <!-- ================= ACCOUNT ================= -->
  <section id="v-account" class="view">
    <header class="top"><h1 class="title sm">Account</h1></header>
    <div id="accountBody"></div>
    <div id="safariPanel"></div>
  </section>
</main>

<nav class="tabbar">
  <a data-tab="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
  <a data-tab="agents"><svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="3.2"/><circle cx="16" cy="8" r="3.2"/><path d="M2 20c0-3.5 2.7-6 6-6s6 2.5 6 6M10 20c0-3.5 2.7-6 6-6s6 2.5 6 6"/></svg>Agents</a>
  <a data-tab="activity"><svg viewBox="0 0 24 24"><path d="M2 12h4l3-7 4 14 3-7h6"/></svg>Activity</a>
  <a data-tab="account"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>Account</a>
</nav>

<script>// Panneau "Version Safari" (onglet Account) + écran toujours allumé
(function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const NAMES = { dexscreener: ['DexScreener', 'prix, liquidité, nouveaux tokens'], geckoterminal: ['GeckoTerminal', 'nouvelles pools'], pumpportal: ['PumpPortal', 'migrations pump.fun en direct'], rpc: ['RPC Solana', 'vérifications on-chain (Auditor)'], rugcheck: ['RugCheck', 'LP brûlée, bundles (Auditor)'] };

  let lock = null, wantLock = true;
  async function keepAwake() {
    if (!wantLock || !('wakeLock' in navigator) || document.hidden) return;
    try { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { lock = null; }); } catch {}
  }
  document.addEventListener('click', keepAwake, { once: true });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) keepAwake(); });

  function render() {
    const mb = $('modeBtn'); if (mb) mb.closest('.card').style.display = 'none';
    const el = $('safariPanel'); const N = window.__neo;
    if (!el || !N || !document.getElementById('v-account').classList.contains('active')) return;
    if (el.contains(document.activeElement) && document.activeElement.tagName === 'INPUT') return;
    const sim = N.settings.dataSource === 'sim';
    const rows = sim ? '<div class="field"><span>Marché simulé</span><b class="green-t">actif</b></div>' : Object.entries(NAMES).map(([k, [name, what]]) => {
      const s = N.sources[k];
      const st = !s ? ['…', 'muted'] : s.last === 'ok' ? ['OK', 'green-t'] : ['Erreur', 'red-t'];
      return `<div class="field"><span>${name}<br><small class="muted">${s && s.last !== 'ok' ? esc(s.err) : what}</small></span><b class="${st[1]}">${st[0]}</b></div>`;
    }).join('');
    const h = N.health;
    el.innerHTML = `<div class="card"><h3>Version Safari (paper uniquement)</h3>
      <p class="muted small">Le bot tourne dans cette page. Il s'arrête si tu fermes Safari, changes d'app ou verrouilles l'iPad. Laisse l'iPad branché, la page ouverte à l'écran.</p>
      <div class="field"><span>Écran maintenu allumé</span><b class="${lock ? 'green-t' : 'muted'}">${lock ? 'Oui' : ('wakeLock' in navigator ? 'touche l\'écran une fois' : 'non supporté : règle le verrouillage auto sur « Jamais »')}</b></div>
      <div class="field"><span>Scans effectués</span><b>${h.scans}</b></div>
      ${h.lastError ? `<div class="field"><span>Dernière erreur<br><small class="muted">${esc(h.lastError)}</small></span><b class="red-t">!</b></div>` : ''}
      <h3 style="margin-top:14px">Sources de données</h3>${rows}
      <div class="seg" style="margin-top:12px"><button id="srcLive" class="${sim ? '' : 'on'}">Vrais marchés</button><button id="srcSim" class="${sim ? 'on' : ''}">Marché simulé</button></div>
      <p class="muted small">Marché simulé = tokens inventés, juste pour voir l'interface bouger. Les résultats ne veulent rien dire.</p>
      <h3 style="margin-top:14px">RPC Solana</h3>
      <p class="muted small">Le RPC public est lent et limité. Une clé gratuite Helius (helius.dev) rend l'Auditor beaucoup plus fiable.</p>
      <input id="rpcIn" class="input" style="width:100%;box-sizing:border-box;padding:10px;border-radius:10px;border:1px solid #333;background:#111;color:#fff" placeholder="https://mainnet.helius-rpc.com/?api-key=..." value="${/mainnet-beta/.test(N.secrets.rpcUrl) ? '' : esc(N.secrets.rpcUrl)}">
      <button class="btn full" id="rpcSave" style="margin-top:8px">Enregistrer le RPC</button>
    </div>`;
    $('srcLive').onclick = () => sim && N.setDataSource('live');
    $('srcSim').onclick = () => !sim && N.setDataSource('sim');
    $('rpcSave').onclick = () => N.setRpc($('rpcIn').value.trim());
  }
  setInterval(render, 2000);
  document.addEventListener('click', (e) => { if (e.target.closest('[data-tab="account"]')) setTimeout(render, 50); });
})();
</script>
<script>// ============ Neo Bot — interface ============
let S = null;            // dernier état complet
let range = 'live', drawAnim = true;
let curView = 'home', prevView = 'home', tokenMint = null, actFilter = 'all';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ---------- formats ----------
const usd = (n, d = 2) => (n < 0 ? '−' : '') + '$' + Math.abs(n || 0).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const sUsd = (n) => (n >= 0 ? '+' : '−') + '$' + Math.abs(n).toFixed(2);
const big = (n) => !n ? '—' : n >= 1e9 ? `$${(n / 1e9).toFixed(2)}B` : n >= 1e6 ? `$${(n / 1e6).toFixed(2)}M` : n >= 1e3 ? `$${(n / 1e3).toFixed(1)}K` : `$${n.toFixed(0)}`;
const px = (p) => { if (!p) return '$0'; if (p >= 1) return '$' + p.toFixed(4); const z = Math.max(0, -Math.floor(Math.log10(p)) - 1); return '$' + p.toFixed(Math.min(z + 4, 12)); };
const tm = (t) => new Date(t).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
const hue = (s) => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
function av(sym, img, badge, size) {
  const st = img ? `background-image:url('${esc(img)}')` : `background:hsl(${hue(sym)},55%,38%)`;
  const b = badge ? `<i class="b" style="background:${badge.c}">${badge.t}</i>` : '';
  return `<div class="av" style="${st};${size ? `width:${size}px;height:${size}px` : ''}">${img ? '' : esc(String(sym || '?').slice(0, 2))}${b}</div>`;
}

// ---------- API ----------
async function api(path, body) {
  const r = await fetch(path, body ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : {});
  if (r.status === 401) { showLogin(); throw new Error('auth'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
function showLogin() { $('login').classList.remove('hidden'); }
$('loginBtn').onclick = async () => {
  const r = await fetch('/api/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ password: $('pw').value }) });
  if (r.ok) { $('login').classList.add('hidden'); boot(); } else $('loginErr').textContent = 'Mot de passe incorrect';
};
$('pw').onkeydown = (e) => e.key === 'Enter' && $('loginBtn').click();

// ---------- WebSocket ----------
let ws;
function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.onmessage = (e) => {
    const { type, data } = JSON.parse(e.data);
    if (type === 'state') { S = data; renderAll(); }
    else if (!S) return;
    else if (type === 'tick') { const keep = { equitySeries: S.equitySeries, activity: S.activity, trades: S.trades, settings: S.settings }; S = { ...S, ...data, ...keep }; S.markers = mergeMarkers(S.markers, data.markers); renderLive(); }
    else if (type === 'equity') { S.equitySeries.push(data); }
    else if (type === 'activity') { S.activity.unshift(data); S.activity = S.activity.slice(0, 200); if (['sold', 'stopped'].includes(data.type)) refreshTrades(); renderActivity(); }
    else if (type === 'audit') { S.auditor.current = data; renderAuditor(); renderAgentCards(); }
    else if (type === 'notify') toast(data);
  };
  ws.onclose = () => setTimeout(connect, 2000);
}
function mergeMarkers(a = [], b = []) { const m = new Map([...a, ...b].map((x) => [x.t + x.label, x])); return [...m.values()].sort((x, y) => x.t - y.t).slice(-200); }
async function refreshTrades() { try { const s = await api('/api/state'); S.trades = s.trades; S.markers = s.markers; } catch {} }

// ---------- Navigation ----------
function go(v, opts = {}) {
  if (v === 'token') tokenMint = opts.mint;
  if (v !== curView) prevView = ['auditor', 'token'].includes(curView) ? prevView : curView;
  curView = v;
  document.querySelectorAll('.view').forEach((x) => { x.classList.toggle('active', x.id === 'v-' + v); x.classList.toggle('push', x.id === 'v-' + v && ['auditor', 'token'].includes(v)); });
  if (v === 'home') drawAnim = true;
  document.querySelectorAll('.tabbar a').forEach((a) => a.classList.toggle('on', a.dataset.tab === v || (['auditor', 'token'].includes(v) && a.dataset.tab === prevView)));
  window.scrollTo(0, 0);
  renderAll();
  if (v === 'token') loadToken();
}
document.querySelectorAll('.tabbar a').forEach((a) => (a.onclick = () => go(a.dataset.tab)));
document.querySelectorAll('[data-back]').forEach((a) => (a.onclick = () => go(prevView || 'home')));
document.querySelectorAll('[data-go]').forEach((a) => (a.onclick = () => go(a.dataset.go)));
$('tf').onclick = (e) => { const b = e.target.closest('button'); if (!b) return; range = b.dataset.r; drawAnim = true; $('tf').querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b)); drawEquity(); };
$('actFilter').onclick = (e) => { const b = e.target.closest('button'); if (!b) return; actFilter = b.dataset.f; $('actFilter').querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b)); renderActivity(); };
$('auditToggle').onchange = (e) => api('/api/settings', { auditEnabled: e.target.checked }).catch((er) => alert(er.message));

// ---------- Rendu ----------
function renderAll() { if (!S) return; renderLive(); renderActivity(); drawEquity(); renderAgentSettings(); renderAccount(); }
function renderLive() {
  if (!S) return;
  document.title = S.botName; $('botName').textContent = S.botName;
  const mb = $('modeBadge');
  mb.textContent = S.dataSource === 'sim' ? 'SIMULATION' : S.mode === 'live' ? 'RÉEL' : 'PAPER';
  mb.className = 'badge ' + (S.dataSource === 'sim' ? 'sim' : S.mode === 'live' ? 'live' : '');
  $('runDot').className = 'run-dot' + (S.running ? ' on' : '');
  $('agentsRunning').textContent = S.running ? '5 running' : 'paused';
  $('agentsRunning').className = S.running ? 'green-t' : 'muted';
  animateBalance(S.equity);
  const d = S.equity - S.startEquity, pct = S.startEquity ? (d / S.startEquity) * 100 : 0;
  $('delta').className = d >= 0 ? 'up' : 'down';
  $('delta').textContent = `${d >= 0 ? '▲' : '▼'} ${usd(Math.abs(d))} (${Math.abs(pct).toFixed(2)}%)`;
  const m = S.startEquity ? S.equity / S.startEquity : 1;
  $('mult').textContent = m.toFixed(2) + 'x'; $('mult').className = 'pill' + (m < 1 ? ' red' : '');
  const st = botStatus();
  $('halted').classList.toggle('hidden', !st); $('halted').className = 'halted' + (st ? '' : ' hidden') + (st?.kind === 'info' ? ' info' : '');
  $('halted').textContent = st?.text || '';
  $('auditToggle').checked = S.settings?.auditEnabled !== false;
  renderAgentCards(); renderPositions(); renderAuditor();
  if (curView === 'activity') renderStats();
  if (curView === 'account') renderAccount();
  if (curView === 'home') drawEquity();
}

const ago = (t) => { if (!t) return 'jamais'; const s = Math.round((Date.now() - t) / 1000); return s < 60 ? `il y a ${s} s` : s < 3600 ? `il y a ${Math.round(s / 60)} min` : `il y a ${Math.round(s / 3600)} h`; };
// Pourquoi le bot n'achète pas en ce moment (affiché sous le solde)
function botStatus() {
  const h = S.health || {};
  if (S.halted) return { kind: 'stop', text: S.halted };
  if (S.pausedUntil) return { kind: 'stop', text: `Pause après une série de pertes · reprise à ${tm(S.pausedUntil)}` };
  if (!S.running) return { kind: 'info', text: 'Bot en pause — Account → Démarrer' };
  if (S.positions.length >= (h.maxOpen || 3)) return { kind: 'info', text: `${S.positions.length}/${h.maxOpen} positions ouvertes : il attend une vente avant d'acheter de nouveau` };
  if (h.lastScanAt && Date.now() - h.lastScanAt > 180000) return { kind: 'stop', text: `Le Scanner n'a rien reçu depuis ${ago(h.lastScanAt).replace('il y a ', '')} — vérifie la connexion Internet du PC` };
  return null;
}

let shownBal = null;
// Compteur façon "odomètre" : chaque chiffre roule vers sa nouvelle valeur
function animateBalance(target) {
  const el = $('balance'), txt = usd(target);
  if (shownBal === txt) return;
  const old = el.querySelectorAll('.odo-c');
  if (old.length !== txt.length || shownBal === null) {
    el.innerHTML = [...txt].map((ch) => /\d/.test(ch)
      ? `<span class="odo-c odo-d"><span class="odo-s">${'0123456789'.split('').map((d) => `<i>${d}</i>`).join('')}</span></span>`
      : `<span class="odo-c">${ch}</span>`).join('');
    if (shownBal === null) el.querySelectorAll('.odo-s').forEach((x) => (x.style.transition = 'none'));
  }
  const cells = el.querySelectorAll('.odo-c');
  [...txt].forEach((ch, i) => {
    const c = cells[i];
    if (/\d/.test(ch)) { const st = c.firstChild; st.style.transitionDelay = `${(txt.length - i) * 25}ms`; st.style.transform = `translateY(-${Number(ch)}em)`; }
    else c.textContent = ch;
  });
  if (shownBal === null) requestAnimationFrame(() => el.querySelectorAll('.odo-s').forEach((x) => (x.style.transition = '')));
  const prev = parseFloat((shownBal || '').replace(/[^0-9.\-]/g, ''));
  if (shownBal !== null && isFinite(prev)) { el.classList.remove('flash-up', 'flash-down'); void el.offsetWidth; el.classList.add(target >= prev ? 'flash-up' : 'flash-down'); }
  shownBal = txt;
}

const seenMk = new Set();
const RANGES = { live: 15 * 60e3, '1h': 3600e3, '4h': 4 * 3600e3, '1d': 864e5, '1w': 7 * 864e5, all: Infinity };
function drawEquity() {
  if (!S || curView !== 'home') return;
  const svg = $('eqChart'), W = svg.clientWidth || 600, H = svg.clientHeight || 230;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const now = Date.now(), from = now - RANGES[range];
  let pts = S.equitySeries.filter((p) => p.t >= from);
  if (pts.length < 2) pts = S.equitySeries.slice(-2);
  if (pts.length < 2) pts = [{ t: now - 60000, v: S.equity }, { t: now, v: S.equity }];
  pts = [...pts, { t: now, v: S.equity }];
  const t0 = pts[0].t, t1 = now;
  let lo = Math.min(...pts.map((p) => p.v)), hi = Math.max(...pts.map((p) => p.v));
  const pad = (hi - lo) * 0.25 || hi * 0.02 || 1; lo -= pad; hi += pad * 1.6;
  const X = (t) => ((t - t0) / (t1 - t0 || 1)) * (W - 24) + 4, Y = (v) => H - 12 - ((v - lo) / (hi - lo)) * (H - 30);
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${X(p.t).toFixed(1)},${Y(p.v).toFixed(1)}`).join('');
  const up = S.equity >= pts[0].v, col = up ? '#22e07a' : '#ff4757';
  const lastX = X(now), lastY = Y(S.equity);
  svg.innerHTML = `<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".28"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    <path class="${drawAnim ? 'area-in' : ''}" d="${line}L${lastX},${H}L${X(pts[0].t)},${H}Z" fill="url(#g)"/>
    <path class="eq-area-line ${drawAnim ? 'draw' : ''}" d="${line}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round"/>
    <line x1="${lastX}" y1="${lastY}" x2="${lastX}" y2="${H}" stroke="${col}" stroke-dasharray="2 4" opacity=".5"/>
    <circle cx="${lastX}" cy="${lastY}" r="9" fill="${col}" opacity=".25"><animate attributeName="r" values="5;12;5" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="${lastX}" cy="${lastY}" r="4.5" fill="${col}"/>`;
  if (drawAnim) { const pl = svg.querySelector('.draw'); if (pl) { const L = pl.getTotalLength(); pl.style.strokeDasharray = L; pl.style.strokeDashoffset = L; requestAnimationFrame(() => { pl.style.transition = 'stroke-dashoffset 1.1s cubic-bezier(.4,0,.2,1)'; pl.style.strokeDashoffset = 0; }); } drawAnim = false; }
  // bulles des trades
  const valAt = (t) => { let best = pts[0]; for (const p of pts) if (p.t <= t) best = p; return best.v; };
  const mk = (S.markers || []).filter((m) => m.t >= t0).slice(-6);
  const used = [];
  $('eqMarkers').innerHTML = mk.map((m) => {
    const x = X(m.t), y = Y(valAt(m.t));
    let yy = y; while (used.some((u) => Math.abs(u.x - x) < 90 && Math.abs(u.y - yy) < 24)) yy -= 24; used.push({ x, y: yy });
    return `<div class="mk ${m.kind}${seenMk.has(m.t + m.label) ? '' : ' pop'}" data-k="${seenMk.add(m.t + m.label) && ''}" style="left:${Math.min(Math.max(x, 50), W - 50)}px;top:${yy}px">${av(m.symbol, m.image)}${esc(m.label)}</div>
      <svg style="position:absolute;left:${x - 4}px;top:${y - 4}px;width:8px;height:8px;overflow:visible"><circle cx="4" cy="4" r="3.5" fill="#000" stroke="${m.kind === 'loss' ? '#ff4757' : m.kind === 'buy' ? '#4aa3ff' : '#22e07a'}" stroke-width="2"/></svg>`;
  }).join('');
}
window.addEventListener('resize', () => drawEquity());

const BADGE = { watching: { c: '#b58900', t: '◷' }, partial: { c: '#22c55e', t: '½' }, bought: { c: '#2f6fed', t: '↗' }, sold: { c: '#22c55e', t: '✓' }, stopped: { c: '#ef4444', t: '✕' }, rejected: { c: '#555', t: 'i' }, skipped: { c: '#555', t: '–' }, error: { c: '#ef4444', t: '!' }, info: { c: '#555', t: 'i' } };
const seenAct = new Set();
function actRow(a) {
  const isNew = !seenAct.has(a.id); seenAct.add(a.id);
  let title, sub, right, rsub, rcls = '';
  const when = tm(a.t);
  switch (a.type) {
    case 'bought': title = `Bought ${a.symbol}`; sub = `Executor · ${when}`; right = usd(a.amountUsd); rsub = esc(a.detail); break;
    case 'sold': title = `Sold ${a.symbol}`; sub = `Risk · ${esc(a.detail)} · ${when}`; right = sUsd(a.amountUsd); rsub = `+${a.pct.toFixed(0)}%`; rcls = 'up'; break;
    case 'stopped': title = `Stopped ${a.symbol}`; sub = `Risk · ${esc(a.detail)} · ${when}`; right = sUsd(a.amountUsd); rsub = `${a.pct.toFixed(1)}%`; rcls = 'down'; break;
    case 'watching': title = `Watching ${a.symbol}`; sub = `Analyst · ${esc(a.detail)}`; right = ''; rsub = when; break;
    case 'partial': title = `Took profit ${a.symbol}`; sub = `Risk · ${esc(a.detail)} · ${when}`; right = sUsd(a.amountUsd); rsub = `+${a.pct.toFixed(0)}%`; rcls = 'up'; break;
    case 'rejected': title = `Rejected ${a.symbol}`; sub = `<span class="r">${a.agent} · ${esc(a.detail)}</span>`; right = 'Skipped'; rsub = when; rcls = 'muted'; break;
    default: title = `${a.symbol || a.agent}`; sub = `${a.agent} · ${esc(a.detail)}`; right = ''; rsub = when;
  }
  return `<div class="row${isNew ? ' slide-in' : ''}" ${a.mint ? `data-mint="${a.mint}"` : ''}>${av(a.symbol, a.image, BADGE[a.type])}<div class="mid"><b>${esc(title)}</b><span>${sub}</span></div><div class="rt"><b class="${rcls}">${right}</b><span>${rsub || ''}</span></div></div>`;
}

    <div class="stat"><label>P&L réalisé</label><b class="${s.realized >= 0 ? 'up' : 'down'}">${sUsd(s.realized)}</b></div>

    <div class="stat"><label>Profit factor</label><b class="${s.profitFactor >= 1 ? 'up' : 'down'}">${s.trades ? pf : '—'}</b><span class="muted small">gains ÷ pertes, &gt;1 = rentable</span></div>
    <div class="stat"><label>Espérance / trade</label><b class="${s.expectancy >= 0 ? 'up' : 'down'}">${s.trades ? sUsd(s.expectancy) : '—'}</b></div>
    <div class="stat"><label>Gain moyen</label><b class="up">${sUsd(s.avgWin)}</b><span class="muted small">meilleur +${s.best.toFixed(0)}%</span></div>

// Carte "en attente" : montre que le bot tourne même quand aucun token ne passe le Scanner
function renderIdle(cur) {
  const el = $('aIdle'), h = S.health || {};
  const idle = !cur || (['rejected', 'cleared', 'waiting'].includes(cur.status) && cur.doneAt && Date.now() - cur.doneAt > 6000);
  el.classList.toggle('hidden', !idle);
  if (!idle) return;
  const stale = h.lastScanAt && Date.now() - h.lastScanAt > 90000;
  el.className = 'idle-card' + (stale ? ' bad' : '');
  el.innerHTML = stale
    ? `<div class="radar bad"></div><div><b>Le Scanner ne répond plus</b><span>Dernier scan ${ago(h.lastScanAt)} — vérifie Internet et la fenêtre noire</span></div>`
    : `<div class="radar"></div><div><b>En attente du prochain token</b>
       <span>Scan ${ago(h.lastScanAt)} · ${S.scanner.poolsSeen.toLocaleString()} pools vus · ${S.scanner.waiting || 0} en file pour un nouveau passage</span>
       <span>${cur?.doneAt ? `Dernier audit ${ago(cur.doneAt)}` : 'Aucun audit pour l\'instant'} · chaque pool avec ≥ $${(S.settings?.minLiquidityUsd || 0).toLocaleString()} de liquidité arrive ici dès qu'elle est repérée</span></div>`;
}

function updateAudit(cur) {
  const stack = $('aStack');
  // la pile s'ouvre dès que la vérification commence
  const open = cur.status !== 'opening';
  stack.classList.toggle('open', open);
  $('aChecks').classList.toggle('open', open);
  stack.classList.toggle('done-ok', cur.status === 'cleared');
  stack.classList.toggle('done-ko', cur.status === 'rejected');
  stack.classList.toggle('done-wait', cur.status === 'waiting');
  const discs = stack.querySelectorAll('.disc'), rows = $('aChecks').querySelectorAll('.ck');
  cur.checks.forEach((c, i) => {
    if (discs[i]) discs[i].className = 'disc ' + c.state;
    const r = rows[i]; if (!r) return;
    if (!r.classList.contains(c.state)) {
      r.className = 'ck ' + c.state + (['ok', 'fail', 'wait'].includes(c.state) ? ' land' : '');
      r.querySelector('b').textContent = c.state === 'reading' ? 'reading…' : c.state === 'skipped' ? 'skipped' : c.state === 'pending' ? '—' : c.value;
      r.querySelector('.ckI').textContent = CK_ICON[c.state];
    }
  });
}
function bump(id, v) { const el = $(id); if (el.textContent !== String(v)) { el.textContent = v; el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); } }

// ---------- Vue token ----------
let tokenTimer;
async function loadToken() {
  clearTimeout(tokenTimer);
  if (curView !== 'token' || !tokenMint) return;
  try { renderToken(await api('/api/token/' + tokenMint)); } catch {}
  tokenTimer = setTimeout(loadToken, 3000);
}
function renderToken(d) {
  const p = d.position, tr = d.trade, src = p || tr || S.activity.find((a) => a.mint === tokenMint) || { symbol: '?' };
  $('tHead').innerHTML = `${av(src.symbol, src.image, null, 40)}<div class="nm"><b>${esc(src.name || src.symbol)}</b><span>${esc(src.symbol)} · Solana · ${tokenMint.slice(0, 4)}…${tokenMint.slice(-4)}</span></div><a class="chip" href="https://dexscreener.com/solana/${tokenMint}" target="_blank">DexScreener ↗</a>`;
  const last = p ? p.lastPrice : tr ? tr.exitPrice : d.candles.at(-1)?.c;
  const entry = (p || tr)?.entryPrice;
  $('tPrice').textContent = px(last);
  if (entry) { const ch = (last / entry - 1) * 100; $('tSince').className = ch >= 0 ? 'up' : 'down'; $('tSince').textContent = `${ch >= 0 ? '▲' : '▼'} ${Math.abs(ch).toFixed(1)}% since entry`; } else $('tSince').textContent = '';
  drawCandles(d.candles, entry, p ? Math.max(p.trailStop || 0, p.hardStop || 0) : null, p?.trailingActive, p && !p.tp1Done ? entry * (1 + S.settings.tp1Pct / 100) : null);
  const o = p || tr || {};
  $('tStats').innerHTML = `<div><label>Market cap</label><b>${big(o.marketCap)}</b></div><div><label>Liquidity</label><b>${big(o.liquidity)}</b></div>
    <div><label>Holders</label><b>${o.holders ? o.holders.toLocaleString() : '—'}</b></div><div><label>24h volume</label><b>${big(o.volume24)}</b></div>`;
  let html = '';
  if (p) {
    html += `<div class="card flex"><span class="ic" style="background:#2a1d4d;color:#8b5cf6;width:34px;height:34px;font-size:16px">◆</span><div style="flex:1"><b>Your position</b><div class="muted small">${usd(p.costUsd)} in · Executor</div></div><div style="text-align:right"><b style="font-size:20px">${usd(p.value)}</b><div class="${p.pnl >= 0 ? 'up' : 'down'} small">${sUsd(p.pnl)}</div></div></div>
      <div class="card flex"><span class="ic" style="background:#3d2410;color:#ff8a3d;width:34px;height:34px;font-size:16px">◉</span><div style="flex:1"><b>Risk · ${esc(p.stopKind || 'stop')}</b><div class="muted small">${p.trailingActive ? `exit if it drops ${S.settings.trailingStopPct}% from top` : p.breakeven ? 'stop moved to entry · no loss possible' : `exit at −${S.settings.stopLossPct}% · breakeven at +${S.settings.breakevenAtPct}%`}${p.tp1Done ? '' : ` · takes ${S.settings.tp1SellPct}% at +${S.settings.tp1Pct}%`}</div></div><div class="mono" style="color:#ff8a3d">${px(Math.max(p.trailStop || 0, p.hardStop || 0))}</div></div>
      <button class="btn red full" id="sellNow">Vendre maintenant</button>`;
  } else if (tr) {
    html += `<div class="card flex ${tr.pnl >= 0 ? 'win' : ''}"><span class="ic" style="background:#3d2410;color:#ff8a3d;width:34px;height:34px;font-size:16px">◉</span><div style="flex:1"><b class="${tr.pnl >= 0 ? 'up' : 'down'}">Risk sold ${esc(tr.symbol)}</b><div class="muted small">${esc(tr.reason)} · ${tm(tr.closedAt)}</div></div><b class="${tr.pnl >= 0 ? 'up' : 'down'}" style="font-size:18px">${sUsd(tr.pnl)}</b></div>`;
    if (tr.buySig || tr.sellSig) html += `<div class="card small">${tr.buySig ? `<a class="green-t" target="_blank" href="https://solscan.io/tx/${tr.buySig}">Tx achat ↗</a>  ` : ''}${tr.sellSig ? `<a class="green-t" target="_blank" href="https://solscan.io/tx/${tr.sellSig}">Tx vente ↗</a>` : ''}</div>`;
  }
  $('tPos').innerHTML = html;
  const sb = $('sellNow'); if (sb) sb.onclick = async () => { if (!confirm(`Vendre ${p.symbol} maintenant ?`)) return; sb.disabled = true; try { await api('/api/sell/' + p.id, {}); } catch (e) { alert(e.message); } loadToken(); };
}
function drawCandles(cs, entry, stop, trailing, tp) {
  const svg = $('tChart'), W = svg.clientWidth || 600, H = svg.clientHeight || 300;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  if (!cs.length) { svg.innerHTML = `<text x="${W / 2}" y="${H / 2}" fill="#666" text-anchor="middle" font-size="13">Historique en cours de construction…</text>`; return; }
  const vals = cs.flatMap((c) => [c.h, c.l]).concat(entry ? [entry] : []).concat(stop ? [stop] : []).concat(tp ? [tp] : []);
  let lo = Math.min(...vals), hi = Math.max(...vals); const pad = (hi - lo) * 0.1 || hi * 0.05; lo -= pad; hi += pad;
  const R = W - 70, cw = R / Math.max(cs.length, 30), Y = (v) => 10 + (1 - (v - lo) / (hi - lo)) * (H - 30);
  let g = '';
  cs.forEach((c, i) => {
    const x = i * cw + cw / 2, up = c.c >= c.o, col = up ? '#22e07a' : '#ff4757';
    g += `<line x1="${x}" x2="${x}" y1="${Y(c.h)}" y2="${Y(c.l)}" stroke="${col}" stroke-width="1"/><rect x="${x - cw * 0.32}" y="${Math.min(Y(c.o), Y(c.c))}" width="${cw * 0.64}" height="${Math.max(1.5, Math.abs(Y(c.o) - Y(c.c)))}" fill="${col}" rx="1"/>`;
  });
  const hl = (v, col, label) => `<line x1="0" x2="${R}" y1="${Y(v)}" y2="${Y(v)}" stroke="${col}" stroke-dasharray="3 4" opacity=".8"/><rect x="2" y="${Y(v) - 15}" rx="3" width="${label.length * 5.6 + 8}" height="13" fill="${col}" opacity=".25"/><text x="6" y="${Y(v) - 5}" fill="${col}" font-size="9">${label}</text>`;
  if (entry) g += hl(entry, '#4aa3ff', 'Executor buy');
  if (stop) g += hl(stop, '#ff8a3d', trailing ? 'Risk trailing stop' : 'Risk stop');
  if (tp) g += hl(tp, '#22e07a', `Take profit ${S.settings.tp1SellPct}%`);
  const lc = cs.at(-1).c, col = lc >= (entry || cs[0].o) ? '#22e07a' : '#ff4757';
  g += `<line x1="0" x2="${R}" y1="${Y(lc)}" y2="${Y(lc)}" stroke="${col}" stroke-dasharray="1 3"/><rect x="${R + 2}" y="${Y(lc) - 8}" width="66" height="16" rx="3" fill="${col}"/><text x="${R + 35}" y="${Y(lc) + 4}" fill="#000" font-size="9" text-anchor="middle" font-weight="700">${px(lc).slice(1, 11)}</text>`;
  svg.innerHTML = g;
}

  ['Scanner', '✱', [['minLiquidityUsd', 'Liquidité min ($)'], ['minVolume1hUsd', 'Volume 1h min ($)'], ['minMcapUsd', 'Market cap min ($)'], ['maxMcapUsd', 'Market cap max ($)'], ['minPoolAgeMin', 'Âge pool min (min)'], ['maxPoolAgeHours', 'Âge pool max (h)']]],
  ['Auditor', '⛉', [['maxAuditsPerMin', 'Audits complets max / minute (quota Helius)'], ['maxDevHoldPct', 'Dev wallet max (%)'], ['maxTop10Pct', 'Top 10 holders max (%)'], ['minLpBurnedPct', 'LP brûlée min (%)']]],
  ['Analyst', '▲', [['minScore', 'Score minimum (0-100)'], ['maxH1ChangePct', 'Rejette si déjà +X % sur 1 h'], ['minBuyRatio', 'Part d\'achats min (0-1)'], ['maxFdvToLiq', 'Market cap / liquidité max'], ['confirmSec', 'Confirmation avant achat (s)'], ['confirmMaxDipPct', 'Annule si rechute de X % pendant la confirmation']]],

  ['Risk', '◉', [['stopLossPct', 'Stop loss (%)'], ['breakevenAtPct', 'Stop au prix d\'entrée dès +(%)'], ['tp1Pct', 'Prise de profit à +(%)'], ['tp1SellPct', '... en vendant (% de la position)'], ['trailingStopPct', 'Trailing stop (% depuis le top)'], ['trailingActivatePct', 'Active le trailing à +(%)'], ['liqDropExitPct', 'Sortie si la liquidité baisse de (%)'], ['maxHoldMin', 'Durée max (min)'], ['dailyMaxLossPct', 'Perte max / jour (%)'], ['lossStreakPause', 'Pause après X pertes d\'affilée'], ['pauseMin', 'Durée de la pause (min)']]],
];
let settingsRendered = false;
function renderAgentSettings() {
  if (!S?.settings || (settingsRendered && curView === 'agents')) return;
  settingsRendered = curView === 'agents';
  $('agentSettings').innerHTML = FIELDS.map(([name, ic, fs]) => `<div class="card"><h3><span class="ic" style="background:var(--card2)">${ic}</span>${name}</h3>
    ${fs.map(([k, l]) => `<div class="field"><span>${l}</span><input type="number" step="any" data-k="${k}" value="${S.settings[k]}" inputmode="decimal"></div>`).join('')}</div>`).join('') +
    `<button class="btn green full" id="saveSettings">Enregistrer</button><p class="muted small">Ces réglages s'appliquent tout de suite. Pour les garder après un redémarrage, reporte-les dans le fichier .env.</p>`;
  $('saveSettings').onclick = async () => {
    const body = {}; $('agentSettings').querySelectorAll('input[data-k]').forEach((i) => (body[i.dataset.k] = Number(i.value)));
    try { const r = await api('/api/settings', body); S.settings = r.settings; toast({ title: S.botName, body: 'Réglages enregistrés', kind: 'info' }); } catch (e) { alert(e.message); }
  };
}

// ---------- Compte ----------
function renderAccount() {
  if (!S || curView !== 'account') return;
  const w = S.wallet;
  $('accountBody').innerHTML = `
    <div class="card"><h3>Statut</h3>
      <div class="field"><span>Bot</span><b class="${S.running ? 'green-t' : 'muted'}">${S.running ? 'En marche' : 'En pause'}</b></div>
      <div class="field"><span>Mode</span><b class="${S.mode === 'live' ? 'red-t' : ''}">${S.mode === 'live' ? 'RÉEL (vrai argent)' : 'Paper (argent fictif)'}</b></div>
      <div class="field"><span>Données</span><b>${S.dataSource === 'sim' ? 'Marché simulé' : 'Marchés réels'}</b></div>
      <div class="field"><span>Disponible</span><b>${usd(S.cash)}</b></div>
      <button class="btn ${S.running ? '' : 'green'} full" id="runBtn">${S.running ? 'Mettre en pause' : 'Démarrer'}</button>
    </div>
    <div class="card"><h3>Diagnostic</h3>
      <div class="field"><span>Dernier scan</span><b>${ago(S.health?.lastScanAt)}</b></div>
      <div class="field"><span>Nouveaux tokens au dernier scan</span><b>${S.health?.lastNew ?? 0}</b></div>
      <div class="field"><span>Tokens surveillés (trop jeunes)</span><b>${S.scanner.watching}</b></div>
      <div class="field"><span>En confirmation</span><b>${(S.watching || []).length}</b></div>
      <div class="field"><span>Positions ouvertes</span><b>${S.positions.length} / ${S.health?.maxOpen ?? '—'}</b></div>
      <div class="field"><span>Serveur Solana (RPC)</span><b class="${S.health?.publicRpc ? 'red-t' : 'green-t'}">${S.health?.publicRpc ? 'public (lent)' : 'personnel'}</b></div>
      ${S.health?.publicRpc && S.dataSource !== 'sim' ? `<div class="warn" style="margin-top:8px">Le serveur Solana public refuse beaucoup de requêtes : l'Auditor ne peut pas tout vérifier et rejette des tokens en « unknown ». Crée une clé gratuite sur helius.dev et mets-la dans RPC_URL du fichier .env.</div>` : ''}
      <div class="field"><span>Dernière erreur</span><span class="small ${S.health?.lastError ? 'red-t' : 'muted'}" style="text-align:right">${S.health?.lastError ? esc(S.health.lastError) + ' · ' + ago(S.health.lastErrorAt) : 'aucune'}</span></div>
    </div>
    ${S.mode === 'live' ? `<div class="card"><h3>Wallet</h3>
      ${w?.error ? `<div class="warn">${esc(w.error)}</div>` : ''}
      <div class="field"><span>Adresse</span><span class="mono">${w?.address || '—'}</span></div>
      <div class="field"><span>Solde SOL</span><b>${(w?.sol || 0).toFixed(4)} SOL</b></div>
      <div class="field"><span>Prix SOL</span><b>${usd(w?.solPrice || 0)}</b></div>
      ${w?.address ? `<a class="green-t small" target="_blank" href="https://solscan.io/account/${w.address}">Voir sur Solscan ↗</a>` : ''}</div>` : `
    <div class="card"><h3>Solde fictif (mode paper)</h3>
      <div class="field"><span>Solde de départ actuel</span><b>${usd(S.startEquity)}</b></div>
      <div class="field"><span>Nouveau solde de départ ($)</span><input type="number" id="resetAmt" min="10" step="10" value="${S.startEquity.toFixed(0)}" inputmode="decimal"></div>
      <div class="seg" id="amtPresets">${[100, 200, 500, 1000, 5000].map((v) => `<button data-v="${v}">$${v.toLocaleString()}</button>`).join('')}</div>
      <button class="btn green full" id="resetBtn">Appliquer et repartir de zéro</button>
      <p class="muted small">Efface l'historique paper (trades, graphe, positions) et redémarre avec ce solde.</p></div>`}
    <div class="card"><h3>Changer de mode</h3>
      ${S.mode === 'paper'
        ? `<div class="warn">Le mode réel utilise du vrai argent. Les memecoins sont extrêmement risqués : la majorité des tokens perdent presque toute leur valeur. Teste en paper plusieurs jours avant, et n'y mets que ce que tu peux perdre en entier.</div>
           <div class="field"><span>Wallet configuré</span><b class="${S.walletConfigured ? 'green-t' : 'red-t'}">${S.walletConfigured ? 'Oui' : 'Non (PRIVATE_KEY dans .env)'}</b></div>
           <button class="btn red full" id="modeBtn">Passer en mode RÉEL</button>`

    </div>`;

        await api('/api/mode', { mode: 'live', confirm: 'LIVE' });

}

// ---------- Notifications ----------
function toast(n) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<div class="logo"></div><div class="mid"><b>${esc(n.title)}</b><span>${esc(n.body)}</span></div><small>now</small>${n.symbol ? av(n.symbol, n.image, null, 32) : ''}`;
  $('toasts').appendChild(el);
  setTimeout(() => el.classList.add('out'), 4200); setTimeout(() => el.remove(), 4600);
  if (n.kind === 'win') confetti();
  if (document.hidden && 'Notification' in window && Notification.permission === 'granted') new Notification(n.title, { body: n.body });
}
function confetti() {
  const cols = ['#22e07a', '#4aa3ff', '#ff4757', '#f5c542', '#8b5cf6', '#fff'];
  for (let i = 0; i < 60; i++) {
    const c = document.createElement('i'); c.className = 'confetti';
    c.style.cssText = `left:${Math.random() * 100}vw;background:${cols[i % cols.length]};animation-duration:${1.8 + Math.random() * 1.8}s;animation-delay:${Math.random() * .4}s`;
    document.body.appendChild(c); setTimeout(() => c.remove(), 4200);
  }
}

$('agentCards').addEventListener('scroll', (e) => {
  const el = e.target, n = el.children.length, i = Math.round(el.scrollLeft / Math.max(1, el.scrollWidth - el.clientWidth) * (n - 1));
  document.querySelectorAll('.dots i').forEach((d, k) => d.classList.toggle('on', k === i));
}, { passive: true });

// ---------- Démarrage ----------
async function boot() {
  try { S = await api('/api/state'); } catch { return; }
  renderAll(); connect();
  if ('Notification' in window && Notification.permission === 'default') document.body.addEventListener('click', () => Notification.requestPermission(), { once: true });
}
boot();
</script>
